# Local dev stack (spec §54, §55): Postgres + Redis + API. `docker compose up`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neermela
      POSTGRES_PASSWORD: neermela
      POSTGRES_DB: neermela
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neermela"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://neermela:neermela@db:5432/neermela
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "node src/db/migrate.js && node src/server.js"

volumes:
  pgdata:
